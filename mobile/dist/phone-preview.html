<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>孕心智护 · 手机展示</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 20%,#eef2eb,transparent 65%),#e6e9e4;font-family:system-ui;color:#385348;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;gap:50px}.intro{max-width:230px}.intro small{letter-spacing:4px;font-size:12px}.intro h1{font-size:30px;font-weight:500;letter-spacing:3px}.intro p{font-size:14px;line-height:1.9;color:#64746b}.slot{position:relative;flex:none}.phone{width:414px;height:896px;padding:38px 10px 12px;background:#252a27;border-radius:52px;border:2px solid #565d56;box-shadow:0 25px 60px #243c3426,inset 0 0 0 3px #121713;transform-origin:top left;position:absolute}.speaker{position:absolute;width:62px;height:6px;left:174px;top:17px;border-radius:6px;background:#0c100e}.camera{position:absolute;left:252px;top:15px;width:9px;height:9px;border-radius:50%;background:#101b20;border:2px solid #343c37}iframe{display:block;width:390px;height:844px;border:0;border-radius:0 0 38px 38px;background:#f5f6f0}@media(max-width:700px){body{gap:0;padding:12px}.intro{display:none}}</style><div class="intro"><small>YUNXIN CARE</small><h1>孕心智护</h1><p>手机界面展示<br>直接在手机画面中点击与滑动<br>底部导航可切换各个页面</p></div><div class="slot"><div class="phone"><span class="speaker"></span><span class="camera"></span><iframe title="孕心智护手机版" src="./?v=mobile2#home"></iframe></div></div><script>function fit(){const s=Math.min(1,(innerHeight-32)/896,(innerWidth-(innerWidth>700?330:24))/414);document.querySelector('.phone').style.transform=`scale(${s})`;Object.assign(document.querySelector('.slot').style,{width:414*s+'px',height:896*s+'px'})}addEventListener('resize',fit);fit()</script></html>
